name: Process
on:
  schedule:
    - cron: "05 03 * * *"
    - cron: "05 11 * * *"
  workflow_dispatch:

env:
  # time zone
  TZ: Asia/Shanghai

  # network proxy aggregate config (optional): base for sites/groups/storage
  SUBSCRIBE_CONF: ${{ secrets.SUBSCRIBE_CONF }}

  # token: prefer the dedicated one, fallback to the collect token
  PUSH_TOKEN: ${{ secrets.PROCESS_GIST_PAT || secrets.GIST_PAT }}

  # gist which collect writes to, used as the default node source
  GIST_LINK: ${{ secrets.GIST_LINK }}

  # gist which process writes to, 'username/gist_id'
  PROCESS_GIST_LINK: ${{ secrets.PROCESS_GIST_LINK }}

  # not check connective
  SKIP_ALIVE_CHECK: ${{ vars.SKIP_ALIVE_CHECK }}

  # skip remark
  SKIP_REMARK: ${{ vars.SKIP_REMARK }}

  # workflow mode
  WORKFLOW_MODE: ${{ vars.WORKFLOW_MODE }}

  # include spwcial protocols, such vless hysteria2 and hysteria
  ENABLE_SPECIAL_PROTOCOLS: ${{ vars.ENABLE_SPECIAL_PROTOCOLS }}

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Prepare
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"
          cache: "pip"

      - name: Install
        run: pip3 install -r requirements.txt

      - name: Configure
        run: python -u subscribe/gistconf.py -o data/process.json

      - name: Process
        run: python -u subscribe/process.py -s data/process.json --overwrite

      - name: Timestamp
        run: date
